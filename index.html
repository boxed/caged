<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Guitar Fretboard Visualizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root {
            color-scheme: light dark;
            --bg:            light-dark(#fafafa, #161616);
            --surface:       light-dark(#ffffff, #1f1f1f);
            --surface-bd:    light-dark(#e0e0e0, #3a3a3a);
            --text:          light-dark(#222,    #e8e8e8);
            --text-2:        light-dark(#555,    #a8a8a8);
            --text-strong:   light-dark(#333,    #f0f0f0);
            --nut:           light-dark(#2a2a2a, #d8d8d8);
            --fret-line:     light-dark(#b8b8b8, #000);
            --string:        light-dark(#a0a0a0, #000);
            --inlay-board:   light-dark(#e4e4e4, #3a3a3a);
            --inlay-below:   light-dark(#7a7a7a, #888);
            --note-bg:       light-dark(#ffffff, #242424);
            --note-bd:       light-dark(#3a3a3a, #b8b8b8);
            --note-text:     light-dark(#202020, #e8e8e8);
            --chord-bd:      light-dark(#2a2a2a, #dcdcdc);
            --root-bg:       light-dark(#2a2a2a, #e8e8e8);
            --root-text:     light-dark(#ffffff, #161616);
            --fret-num:      light-dark(#444,    #bbb);
            --fret-num-bg:   light-dark(#ededed, #2e2e2e);
            --triangle:      light-dark(#888,    #a8a8a8);
            --btn-bg:        light-dark(#ffffff, #262626);
            --btn-bd:        light-dark(#bbb,    #4a4a4a);
            --btn-text:      light-dark(#333,    #d8d8d8);
            --btn-on-bg:     light-dark(#2a2a2a, #e8e8e8);
            --btn-on-text:   light-dark(#ffffff, #161616);
            /* Dark-mode colors: shared hues with light pastels, but high chroma
               in oklab space so they read as vivid after the 0.45 overlay blend. */
            --box-1: light-dark(#c7a8d4, oklch(0.52 0.27 305));
            --box-2: light-dark(#f4b683, oklch(0.63 0.17  55));
            --box-3: light-dark(#98cfe3, oklch(0.58 0.19 230));
            --box-4: light-dark(#f5adbb, oklch(0.58 0.22  10));
            --box-5: light-dark(#aed9a2, oklch(0.62 0.20 140));

            /* Triad lassos, colored by which chord tone is in the bass. Same
               hues as boxes 1-3, but saturated: a 3px ring needs more punch
               than a 55%-opacity fill does. */
            --inv-1: light-dark(oklch(0.52 0.20 305), oklch(0.72 0.19 305));
            --inv-2: light-dark(oklch(0.60 0.16  55), oklch(0.76 0.16  55));
            --inv-3: light-dark(oklch(0.55 0.15 230), oklch(0.73 0.15 230));
            /* Pitch-class colors for the All notes map. Hues follow the circle
               of fifths (30 deg per fifth), so a semitone step is half the wheel
               away and adjacent frets never look alike; the seven naturals land
               in the warm half, the five accidentals in the cool half. Equal
               lightness across all twelve so hue alone carries the identity. */
            --pc-0:  light-dark(oklch(0.87 0.115  25), oklch(0.45 0.14  25)); /* C  */
            --pc-1:  light-dark(oklch(0.87 0.115 235), oklch(0.45 0.14 235)); /* C# */
            --pc-2:  light-dark(oklch(0.87 0.115  85), oklch(0.45 0.14  85)); /* D  */
            --pc-3:  light-dark(oklch(0.87 0.115 295), oklch(0.45 0.14 295)); /* D# */
            --pc-4:  light-dark(oklch(0.87 0.115 145), oklch(0.45 0.14 145)); /* E  */
            --pc-5:  light-dark(oklch(0.87 0.115 355), oklch(0.45 0.14 355)); /* F  */
            --pc-6:  light-dark(oklch(0.87 0.115 205), oklch(0.45 0.14 205)); /* F# */
            --pc-7:  light-dark(oklch(0.87 0.115  55), oklch(0.45 0.14  55)); /* G  */
            --pc-8:  light-dark(oklch(0.87 0.115 265), oklch(0.45 0.14 265)); /* G# */
            --pc-9:  light-dark(oklch(0.87 0.115 115), oklch(0.45 0.14 115)); /* A  */
            --pc-10: light-dark(oklch(0.87 0.115 325), oklch(0.45 0.14 325)); /* A# */
            --pc-11: light-dark(oklch(0.87 0.115 175), oklch(0.45 0.14 175)); /* B  */
        }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        body {
            width: max-content;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
        }
    </style>
</head>
<body>
    <script src="elm.js"></script>
    <script>
        const app = Elm.Main.init();

        let wakeLock = null;
        let wakeLockWanted = false;

        async function acquireWakeLock() {
            if (!('wakeLock' in navigator)) {
                app.ports.wakeLockChanged.send(false);
                return;
            }
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (err) {
                console.error('Wake lock request failed:', err);
                wakeLockWanted = false;
                app.ports.wakeLockChanged.send(false);
            }
        }

        app.ports.requestWakeLock.subscribe(() => {
            wakeLockWanted = true;
            acquireWakeLock();
        });

        app.ports.releaseWakeLock.subscribe(async () => {
            wakeLockWanted = false;
            if (wakeLock !== null) {
                try { await wakeLock.release(); } catch (err) {}
                wakeLock = null;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (wakeLockWanted && document.visibilityState === 'visible') {
                acquireWakeLock();
            }
        });
    </script>
</body>
</html>
